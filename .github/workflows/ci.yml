name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # кириллица и пробел: модели и запуски идут через не-ASCII путь на всех ОС
      AUDIO2TEXT_CACHE: ${{ github.workspace }}/кэш моделей
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Cache models
        uses: actions/cache@v4
        with:
          path: ${{ env.AUDIO2TEXT_CACHE }}/models
          key: models-${{ runner.os }}-${{ hashFiles('src/audio2text/models.py') }}

      - name: Tests (with real models)
        env:
          PYTHONUTF8: "1"
        run: uv run pytest -v

      - name: Install as a tool
        run: |
          uv tool install .
          echo "$(uv tool dir --bin)" >> "$GITHUB_PATH"

      - name: Reinstall from a zip archive (the README install form)
        run: |
          git archive --format=zip -o a2t.zip HEAD
          uv tool install --reinstall ./a2t.zip
          audio2text --help

      - name: Smoke - local file
        run: |
          curl -fL -o sample.wav "https://huggingface.co/csukuangfj/sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8/resolve/main/test_wavs/en.wav"
          audio2text sample.wav out.md
          cat out.md
          grep -q "SPEAKER_" out.md

      - name: Smoke - YouTube (субтитры)
        continue-on-error: true
        run: |
          audio2text "https://www.youtube.com/watch?v=jNQXAC9IVRw" yt-subs.md
          cat yt-subs.md
          grep -q "субтитры YouTube" yt-subs.md

      - name: Smoke - YouTube (-tr)
        continue-on-error: true
        run: |
          audio2text "https://www.youtube.com/watch?v=jNQXAC9IVRw" -tr yt.md
          cat yt.md
          grep -q "SPEAKER_" yt.md
