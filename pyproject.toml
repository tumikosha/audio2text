[project]
name = "audio2text"
version = "0.1.0"
description = "Аудиофайл или ссылка YouTube в Markdown с говорящими, локально (sherpa-onnx)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sherpa-onnx>=2.0.3,<3",
    "numpy>=2,<3",
    "imageio-ffmpeg>=0.5,<1",
    "platformdirs>=4,<5",
]

[project.scripts]
audio2text = "audio2text.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audio2text"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: needs the real models (downloaded once into the cache)"]
